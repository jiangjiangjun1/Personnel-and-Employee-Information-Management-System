name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: personnel_management
          MYSQL_USER: personnel
          MYSQL_PASSWORD: personnel_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI_DB: "true"
      DB_URL: "jdbc:mysql://127.0.0.1:3306/personnel_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      DB_USERNAME: personnel
      DB_PASSWORD: personnel_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify application
        run: mvn -B verify
