services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: personnel-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personnel_management
      MYSQL_USER: personnel
      MYSQL_PASSWORD: personnel_dev
      MYSQL_ROOT_PASSWORD: personnel_root_dev
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - personnel-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  personnel-mysql-data:
